name: Release standalone CLI

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            script: build:cli:darwin-arm64
            artifact: voiceflow-cli-darwin-arm64
          - target: darwin-x64
            script: build:cli:darwin-x64
            artifact: voiceflow-cli-darwin-x64
          - target: linux-arm64
            script: build:cli:linux-arm64
            artifact: voiceflow-cli-linux-arm64
          - target: linux-x64
            script: build:cli:linux-x64
            artifact: voiceflow-cli-linux-x64
          - target: windows-x64
            script: build:cli:windows-x64
            artifact: voiceflow-cli-windows-x64.exe
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Confirm tag and package versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(bun -e 'console.log(require("./package.json").version)')" = "$RELEASE_TAG"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build target
        run: bun run "${{ matrix.script }}"

      - name: Validate target artifact
        run: bun run verify:cli -- "${{ matrix.target }}"

      - name: Upload target artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assert the complete target matrix
        run: |
          set -eu
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
          for artifact in \
            voiceflow-cli-darwin-arm64 \
            voiceflow-cli-darwin-x64 \
            voiceflow-cli-linux-arm64 \
            voiceflow-cli-linux-x64 \
            voiceflow-cli-windows-x64.exe; do
            test -f "dist/$artifact"
          done

      - name: Create checksums and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          (cd dist && sha256sum voiceflow-cli-*) > dist/SHA256SUMS
          cat > RELEASE_NOTES.md <<EOF
          # Voiceflow CLI $RELEASE_TAG

          Built from commit $GITHUB_SHA with Bun $BUN_VERSION.

          | Platform | Artifact |
          | --- | --- |
          | macOS ARM64 | voiceflow-cli-darwin-arm64 |
          | macOS x64 | voiceflow-cli-darwin-x64 |
          | Linux ARM64 | voiceflow-cli-linux-arm64 |
          | Linux x64 | voiceflow-cli-linux-x64 |
          | Windows x64 | voiceflow-cli-windows-x64.exe |

          Verify downloaded files with SHA256SUMS before execution.
          See docs/cli-release-operations.md for rollback guidance.
          EOF

      - name: Publish build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/voiceflow-cli-*'

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Voiceflow CLI $RELEASE_TAG" --notes-file RELEASE_NOTES.md
